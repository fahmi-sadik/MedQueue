<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Appointment</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f7f7f7; }
        .card { box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="card w-full max-w-lg bg-white rounded-xl p-8 border border-gray-200">
        <h1 class="text-3xl font-bold text-gray-800 mb-6 text-center">Book a New Appointment</h1>

        <!-- Flash Messages -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <ul class="mb-4">
                {% for category, message in messages %}
                    <li class="p-3 text-sm rounded-lg {% if category == 'success' %}bg-green-100 text-green-800{% elif category == 'danger' %}bg-red-100 text-red-800{% else %}bg-yellow-100 text-yellow-800{% endif %}">
                        {{ message }}
                    </li>
                {% endfor %}
                </ul>
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('book_appointment') }}" class="space-y-6">
            
            <div>
                <label for="doctor_id" class="block text-sm font-medium text-gray-700 mb-1">Select Doctor</label>
                <select id="doctor_id" name="doctor_id" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500">
                    <option value="" disabled selected>--- Choose a Doctor ---</option>
                    {% for doctor in doctors %}
                        <option value="{{ doctor.id }}">{{ doctor.name }} ({{ doctor.specialty }})</option>
                    {% endfor %}
                </select>
            </div>
            
            <div>
                <label for="emergency_level" class="block text-sm font-medium text-gray-700 mb-1">Select Urgency Level (1-5)</label>
                <select id="emergency_level" name="emergency_level" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500">
                    <option value="" disabled selected>--- Select Urgency ---</option>
                    <option value="5">5 - Critical (Immediate life threat)</option>
                    <option value="4">4 - Severe (Urgent attention needed)</option>
                    <option value="3">3 - Moderate (Necessary attention)</option>
                    <option value="2">2 - Minor (Routine check)</option>
                    <option value="1">1 - Low (Non-urgent/Preventative)</option>
                </select>
                <p class="text-xs text-gray-500 mt-1">Higher numbers mean higher priority in the queue.</p>
            </div>

            <button type="submit" class="w-full py-3 px-4 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-lg transition duration-150 ease-in-out">
                Submit Appointment
            </button>
        </form>

        <div class="mt-6 text-center">
            <a href="{{ url_for('user_dashboard') }}" class="text-sm text-indigo-600 hover:text-indigo-800 font-medium">
                &larr; Back to User Dashboard
            </a>
        </div>
    </div>
</body>
</html>
